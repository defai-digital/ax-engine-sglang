name: Publish Python package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to public PyPI from a version tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the CPU suite
        run: |
          python -m pip install 'setuptools>=77' wheel jsonschema scipy
          python -m unittest discover -s ax-engine-sglang/tests
      - name: Build and check distributions
        run: |
          python -m pip install build twine uv
          python -m build --outdir dist ax-engine-sglang
          python -m twine check --strict dist/*
      - name: Resolve the wheel's dependencies for Linux amd64 and arm64
        run: |
          wheel=(dist/ax_engine_sglang-*.whl)
          printf 'ax-engine-sglang @ file://%s/%s\n' "$PWD" "${wheel[0]}" > "$RUNNER_TEMP/ax-sglang-requirements.txt"
          for platform in x86_64-manylinux_2_34 aarch64-manylinux_2_34; do
            for python_version in 3.11 3.12; do
              uv pip compile --python-version "$python_version" --python-platform "$platform" \
                --only-binary :all: --index-url https://pypi.org/simple "$RUNNER_TEMP/ax-sglang-requirements.txt" > /dev/null
            done
          done
      - name: Smoke-test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/ax-sglang-smoke"
          source "$RUNNER_TEMP/ax-sglang-smoke/bin/activate"
          python -m pip install --no-deps dist/ax_engine_sglang-*.whl
          wheel_version=$(python -c 'from importlib.metadata import version; print(version("ax-engine-sglang"))')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$wheel_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $wheel_version" >&2
            exit 1
          fi
          cd "$RUNNER_TEMP"
          ax-engine-sglang --help
          test "$(ax-engine-sglang --version)" = "ax-engine-sglang $wheel_version"
      - uses: actions/upload-artifact@v7
        with:
          name: ax-engine-sglang-dist
          path: dist/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/ax-engine-sglang/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ax-engine-sglang-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
