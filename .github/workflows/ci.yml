name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: CPU tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=77' wheel jsonschema scipy
      - run: python -m unittest discover -s ax-engine-sglang/tests -v
      - run: python scripts/check_engine_contracts.py --validate-schema
      - run: python -m compileall -q ax-engine-sglang/ax_engine_sglang

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and check the wheel
        run: |
          python -m pip install build twine
          python -m build --outdir dist ax-engine-sglang
          python -m twine check --strict dist/*
      - name: Smoke-test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/ax-sglang-smoke"
          source "$RUNNER_TEMP/ax-sglang-smoke/bin/activate"
          python -m pip install --no-deps dist/ax_engine_sglang-*.whl
          wheel_version=$(python -c 'from importlib.metadata import version; print(version("ax-engine-sglang"))')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$wheel_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $wheel_version" >&2
            exit 1
          fi
          cd "$RUNNER_TEMP"
          ax-engine-sglang --help
          test "$(ax-engine-sglang --version)" = "ax-engine-sglang $wheel_version"
